name: Continuous Integration

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      EL_CRUCE_ENVIRONMENT: test
      DJANGO_SECRET_KEY: ci-django-secret-key-not-for-production
      JWT_SIGNING_KEY: ci-jwt-signing-key-not-for-production-distinct-from-django
      DJANGO_ALLOWED_HOSTS: testserver
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_DB: elcruce_ci
      POSTGRES_USER: elcruce_ci
      POSTGRES_PASSWORD: ci-postgres-password-not-for-production
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: elcruce_ci
          POSTGRES_USER: elcruce_ci
          POSTGRES_PASSWORD: ci-postgres-password-not-for-production
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U elcruce_ci -d elcruce_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: "0.13.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --locked --all-groups

      - name: Lint backend
        run: uv run --locked ruff check .

      - name: Test backend with coverage
        run: uv run --locked pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_BASE_URL: /api

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend with coverage
        run: npm run coverage

      - name: Test prerender generation
        run: npm run test:prerender

      - name: Build frontend for production
        run: npm run build

      - name: Verify prerendered artifacts
        run: npm run verify:prerender
